<!-- ==========================================================================
     Custom <head> additions
     - Analytics: PostHog (product) + GA4 (via theme's analytics provider)
     - Diagrams: Mermaid / PlantUML are loaded ON DEMAND, only on pages that
       actually contain a diagram. Keeps ~1MB off every other page.
     ========================================================================== -->

<!-- The theme only emits twitter:* tags when site.twitter.username is set.
     Declare the card type so X/Twitter renders a large preview from the og: tags. -->
<meta name="twitter:card" content="summary_large_image">

<!-- Favicons: the theme emits no <link rel="icon">, so declare them explicitly -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

<!-- Diagram rendering: only pulled in when the page has a diagram -->
<script>
(function () {
  'use strict';

  var MERMAID_SRC = 'https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js';
  var PLANTUML_SRC = 'https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js';

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function renderMermaid(blocks) {
    return loadScript(MERMAID_SRC).then(function () {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        flowchart: { htmlLabels: true, useMaxWidth: true },
        sequence: { useMaxWidth: true, wrap: true }
      });

      blocks.forEach(function (block, index) {
        var code = block.textContent;
        var holder = document.createElement('div');
        holder.className = 'mermaid-diagram';
        holder.id = 'mermaid-' + index;
        holder.style.textAlign = 'center';
        holder.style.margin = '20px 0';

        var pre = block.parentNode;
        pre.parentNode.replaceChild(holder, pre);

        mermaid.render('mermaid-svg-' + index, code)
          .then(function (result) { holder.innerHTML = result.svg; })
          .catch(function () {
            holder.innerHTML = '<p role="alert">Diagram could not be rendered.</p>';
          });
      });
    });
  }

  function renderPlantUml(blocks) {
    return loadScript(PLANTUML_SRC).then(function () {
      blocks.forEach(function (block) {
        var img = document.createElement('img');
        img.src = 'https://www.plantuml.com/plantuml/png/' + plantumlEncoder.encode(block.textContent);
        img.alt = 'PlantUML diagram';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.style.maxWidth = '100%';
        img.style.height = 'auto';

        var pre = block.parentNode;
        pre.parentNode.replaceChild(img, pre);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var mermaidBlocks = Array.prototype.slice.call(
      document.querySelectorAll('pre code.language-mermaid'));
    var plantUmlBlocks = Array.prototype.slice.call(
      document.querySelectorAll('pre code.language-plantuml'));

    if (mermaidBlocks.length) { renderMermaid(mermaidBlocks); }
    if (plantUmlBlocks.length) { renderPlantUml(plantUmlBlocks); }
  });
})();
</script>
